<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Icon Gen</title>
<style>body{margin:0;background:#f5f4f0;font-family:sans-serif}canvas{display:block}#status{position:fixed;top:8px;left:8px;padding:4px 8px;background:rgba(0,0,0,0.7);color:#fff;font-size:11px;z-index:10}</style>
</head><body><div id="status">loading…</div>
<script type="importmap">{"imports":{"three":"https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.js","three/addons/loaders/GLTFLoader.js":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js","three/addons/loaders/DRACOLoader.js":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/DRACOLoader.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const params = new URLSearchParams(location.search);
const w = 512, h = 512;
const setStatus = t => document.getElementById('status').textContent = t;

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, preserveDrawingBuffer:true });
renderer.setPixelRatio(1);
renderer.setSize(w, h);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const draco = new DRACOLoader();
draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
const loader = new GLTFLoader().setDRACOLoader(draco);

function makeScene(bg) {
  const scene = new THREE.Scene();
  scene.add(new THREE.AmbientLight(0xffffff, 0.65));
  const key = new THREE.DirectionalLight(0xffffff, 1.4);
  key.position.set(4, 6, 4); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.top = 4; key.shadow.camera.bottom = -4;
  key.shadow.camera.left = -4; key.shadow.camera.right = 4;
  key.shadow.camera.near = 0.5; key.shadow.camera.far = 20;
  key.shadow.bias = -0.001;
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 0.45);
  fill.position.set(-3, 3, -3); scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffffff, 0.3);
  rim.position.set(0, 2, -5); scene.add(rim);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({ opacity: 0.18 }));
  floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);
  renderer.setClearColor(new THREE.Color(bg || '#f5f4f0'), 1);
  return scene;
}

async function renderItem(item) {
  const scene = makeScene(item.bg);
  const gltf = await loader.loadAsync(item.glb);
  let obj = gltf.scene;
  scene.add(obj);
  obj.updateMatrixWorld(true);
  obj.traverse(ch => {
    if (ch.isMesh) {
      ch.castShadow = true; ch.receiveShadow = true;
      // Force black metal look for legs (metals appear as dark PBR steel)
      if (item.color === 'black' && ch.material) {
        const mats = Array.isArray(ch.material) ? ch.material : [ch.material];
        for (const m of mats) {
          m.color = new THREE.Color(0x0d0d0d);
          m.metalness = 0.4;
          m.roughness = 0.55;
          m.envMapIntensity = 1;
          m.needsUpdate = true;
        }
      }
    }
  });

  // Center on origin, rest bottom on floor
  const box = new THREE.Box3().setFromObject(obj);
  const sizeVec = box.getSize(new THREE.Vector3());
  const centerVec = box.getCenter(new THREE.Vector3());
  obj.position.sub(new THREE.Vector3(centerVec.x, box.min.y, centerVec.z));
  obj.updateMatrixWorld(true);

  // Normalize to reference size — put biggest dim to 1.0 unit tall
  const maxDim = Math.max(sizeVec.x, sizeVec.y, sizeVec.z);
  const scale = 1.0 / Math.max(1e-6, maxDim);
  obj.scale.setScalar(scale);
  obj.updateMatrixWorld(true);

  // Recompute box after normalization
  const finalBox = new THREE.Box3().setFromObject(obj);
  const finalSize = finalBox.getSize(new THREE.Vector3());
  const finalCenter = finalBox.getCenter(new THREE.Vector3());
  const bboxRadius = finalBox.getBoundingSphere(new THREE.Sphere()).radius;

  // Camera: fixed FOV, distance chosen so bounding sphere fills (frameFactor)% of view
  const azr = (item.az ?? 25) * Math.PI / 180;
  const elr = (item.el ?? 18) * Math.PI / 180;
  const fov = item.fov ?? 30;
  const frameFactor = item.pad ?? 1.55;  // >1 = more padding
  const halfFov = fov * 0.5 * Math.PI / 180;
  const distance = (bboxRadius / Math.sin(halfFov)) * frameFactor;

  const camera = new THREE.PerspectiveCamera(fov, w/h, 0.05, 200);
  camera.position.set(
    finalCenter.x + distance * Math.cos(elr) * Math.sin(azr),
    finalCenter.y + distance * Math.sin(elr),
    finalCenter.z + distance * Math.cos(elr) * Math.cos(azr)
  );
  camera.lookAt(finalCenter);

  renderer.render(scene, camera);
  await new Promise(r => setTimeout(r, 80));
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/png');
}

async function main() {
  const batchB64 = params.get('batch');
  const single = params.get('glb');
  let items;
  if (batchB64) items = JSON.parse(atob(batchB64));
  else if (single) items = [{ name: params.get('name') || 'test', glb: single,
    az: parseFloat(params.get('az')) || undefined,
    el: parseFloat(params.get('el')) || undefined,
    fov: parseFloat(params.get('fov')) || undefined,
    pad: parseFloat(params.get('pad')) || undefined,
    color: params.get('color') || undefined
  }];
  else { setStatus('use ?batch=<b64json> or ?glb=<path>&az&el&fov&pad'); return; }
  const results = [];
  for (let i = 0; i < items.length; i++) {
    setStatus(`rendering ${i+1}/${items.length}: ${items[i].name}`);
    try {
      const png = await renderItem(items[i]);
      // POST to server for persistence
      const b64 = png.substring('data:image/png;base64,'.length);
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let j = 0; j < bin.length; j++) bytes[j] = bin.charCodeAt(j);
      await fetch('/api/upload-icon', {
        method: 'POST',
        headers: { 'Content-Type': 'application/octet-stream', 'X-Icon-Name': items[i].name + '.png' },
        body: bytes
      });
      results.push({ name: items[i].name, ok: true });
    } catch (e) {
      results.push({ name: items[i].name, err: e.message });
      console.error(items[i].name, e);
    }
  }
  window.__results = results;
  setStatus(`done: ${results.length}`);
  document.title = 'READY';
}
main().catch(e => { setStatus('ERR: ' + e.message); console.error(e); });
</script></body></html>
