<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Icon Gen</title>
<style>body{margin:0;background:#f5f4f0;font-family:sans-serif}canvas{display:block}#status{position:fixed;top:8px;left:8px;padding:4px 8px;background:rgba(0,0,0,0.7);color:#fff;font-size:11px;z-index:10}</style>
</head><body><div id="status">loading…</div>
<script type="importmap">{"imports":{"three":"https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.js","three/addons/loaders/GLTFLoader.js":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js","three/addons/loaders/DRACOLoader.js":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/DRACOLoader.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const params = new URLSearchParams(location.search);
const w = 512, h = 512;
const setStatus = t => document.getElementById('status').textContent = t;

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, preserveDrawingBuffer:true });
renderer.setPixelRatio(1);
renderer.setSize(w, h);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const draco = new DRACOLoader();
draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
const loader = new GLTFLoader().setDRACOLoader(draco);

function makeScene(bg) {
  const scene = new THREE.Scene();
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const key = new THREE.DirectionalLight(0xffffff, 1.1);
  key.position.set(4, 5, 3); key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024); scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 0.3);
  fill.position.set(-3, 3, -3); scene.add(fill);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({ opacity: 0.15 }));
  floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);
  renderer.setClearColor(new THREE.Color(bg || '#f5f4f0'), 1);
  return scene;
}

async function renderItem(item) {
  const scene = makeScene(item.bg);
  const gltf = await loader.loadAsync(item.glb);
  let obj = gltf.scene;
  scene.add(obj);
  obj.updateMatrixWorld(true);
  obj.traverse(ch => { if (ch.isMesh) { ch.castShadow = true; ch.receiveShadow = true; } });
  const box = new THREE.Box3().setFromObject(obj);
  const sizeVec = box.getSize(new THREE.Vector3());
  const centerVec = box.getCenter(new THREE.Vector3());
  obj.position.sub(new THREE.Vector3(centerVec.x, box.min.y, centerVec.z));
  obj.updateMatrixWorld(true);
  const maxDim = Math.max(sizeVec.x, sizeVec.y, sizeVec.z);
  const scale = (item.d || 3.2) / Math.max(1e-6, maxDim);
  obj.scale.setScalar(scale);
  obj.updateMatrixWorld(true);
  const finalBox = new THREE.Box3().setFromObject(obj);
  const center = finalBox.getCenter(new THREE.Vector3());
  const camera = new THREE.PerspectiveCamera(35, w/h, 0.1, 100);
  const azr = (item.az ?? 35) * Math.PI / 180;
  const elr = (item.el ?? 20) * Math.PI / 180;
  const R = 3.5;
  camera.position.set(
    center.x + R * Math.cos(elr) * Math.sin(azr),
    center.y + R * Math.sin(elr),
    center.z + R * Math.cos(elr) * Math.cos(azr)
  );
  camera.lookAt(center);
  renderer.render(scene, camera);
  await new Promise(r => setTimeout(r, 50));
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/png');
}

async function main() {
  const batchB64 = params.get('batch');
  if (!batchB64) { setStatus('use ?batch=<base64json>'); return; }
  const items = JSON.parse(atob(batchB64));
  const results = [];
  for (let i = 0; i < items.length; i++) {
    setStatus(`rendering ${i+1}/${items.length}: ${items[i].name}`);
    try {
      const png = await renderItem(items[i]);
      // POST to server for persistence
      const b64 = png.substring('data:image/png;base64,'.length);
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let j = 0; j < bin.length; j++) bytes[j] = bin.charCodeAt(j);
      await fetch('/api/upload-icon', {
        method: 'POST',
        headers: { 'Content-Type': 'application/octet-stream', 'X-Icon-Name': items[i].name + '.png' },
        body: bytes
      });
      results.push({ name: items[i].name, ok: true });
    } catch (e) {
      results.push({ name: items[i].name, err: e.message });
    }
  }
  window.__results = results;
  setStatus(`done: ${results.length} items`);
  document.title = 'READY';
}
main().catch(e => { setStatus('ERR: ' + e.message); console.error(e); });
</script></body></html>
